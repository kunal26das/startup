<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>App Startup sample &middot; Kotlin/Wasm</title>
    <style>
        body { margin: 0; background: #101418; color: #e6edf3; font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; }
        main { max-width: 720px; margin: 0 auto; padding: 32px 20px; }
        h1 { font-size: 15px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #7d8590; margin: 0 0 20px; }
        pre { margin: 0; white-space: pre-wrap; line-height: 1.6; }
    </style>
</head>
<body>
<main>
    <h1>Kotlin/Wasm</h1>
    <pre id="report"></pre>
</main>
<script>
    (function () {
        var report = document.getElementById("report");
        var forward = console.log.bind(console);
        console.log = function () {
            var text = Array.prototype.join.call(arguments, " ");
            if (!/^\[(HMR|webpack)/.test(text)) {
                report.appendChild(document.createTextNode(text + "\n"));
            }
            forward.apply(console, arguments);
        };
    })();
</script>
<script type="application/javascript" src="sample.js"></script>
</body>
</html>
