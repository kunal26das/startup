name: build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and test every target
        run: >
          ./gradlew build
          testAndroidHostTest
          desktopTest
          macosArm64Test
          iosSimulatorArm64Test
          jsNodeTest
          wasmJsNodeTest
          linkDebugTestLinuxX64
          linkDebugTestMingwX64
          :sample:compileAndroidMain
          :sample:compileKotlinDesktop
          :sample:compileKotlinJs
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-reports
          path: "**/build/reports/tests"
          if-no-files-found: ignore

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run the linuxX64 tests
        run: ./gradlew linuxX64Test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-reports
          path: "**/build/reports/tests"
          if-no-files-found: ignore

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run the mingwX64 tests
        shell: bash
        run: ./gradlew mingwX64Test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-reports
          path: "**/build/reports/tests"
          if-no-files-found: ignore
